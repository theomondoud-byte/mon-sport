name: Tests Mon Sport
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe
        run: npm run check
      - name: Tests de non-régression
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances du collecteur ATP live
        run: python -m pip install requests beautifulsoup4
      - name: Tests du collecteur ATP live
        run: python -m unittest discover -s tests -p '*_py_test.py'
      - name: Examiner les champs ESPN reçus (diagnostic V14.7)
        run: |
          node --input-type=module <<'NODE'
          for(const [id,path] of [['ligue1','soccer/fra.1'],['liga','soccer/esp.1'],['ucl','soccer/uefa.champions'],['nba','basketball/nba']]){
            try {
              const res=await fetch('https://site.api.espn.com/apis/v2/sports/'+path+'/standings', {signal:AbortSignal.timeout(10000)});
              const body=await res.json();const groups=[];
              function visit(v,parent=''){
                if(!v||typeof v!=='object')return;
                let name=v.name||v.displayName||parent;
                let rows=Array.isArray(v.standings?.entries)?v.standings.entries:Array.isArray(v.entries)?v.entries:[];
                if(rows.length)groups.push({name,count:rows.length,first:rows[0],last:rows[rows.length-1]});
                for(const child of [...(v.children||[]),...(v.groups||[])])visit(child,name);
              }
              visit(body);console.log('ESPN_DIAG',id,'status',res.status,'groups',JSON.stringify(groups.map(g=>({name:g.name,count:g.count}))));
              for(const group of groups.slice(0,2)){
                const first=group.first||{};
                console.log('ESPN_STAT',id,group.name,JSON.stringify({team:first.team?.displayName, stats:first.stats||first.statistics, keys:Object.keys(first)}).slice(0,6000));
              }
            } catch(e) {console.log('ESPN_ERROR',id,String(e));}
          }
          NODE
      - name: Examiner un classement de tennis de table public (diagnostic)
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://www.eleventabletennis.com/rankings'
          try:
              r=requests.get(url,timeout=20,headers={'User-Agent':'Mozilla/5.0 (MonSport sports rankings personal dashboard)'})
              print('WTT_HTTP',r.status_code,'BYTES',len(r.content),'REDIRECT',r.url)
              soup=BeautifulSoup(r.text,'html.parser')
              print('WTT_TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              tables=soup.select('table')
              print('WTT_TABLES',[(t.get('id'),t.get('class'),len(t.select('tr'))) for t in tables[:12]])
              for t in tables[:2]:
                  print('WTT_HEAD',[(r.get_text(' ',strip=True)[:120]) for r in t.select('tr')[:4]])
              for text in soup.find_all(string=lambda x:x and 'Wang Manyu' in x)[:3]:
                  print('WTT_SAMPLE',str(text.parent.parent.get_text(' ',strip=True))[:250])
          except Exception as error: print('WTT_ERROR',str(error))
          PY
