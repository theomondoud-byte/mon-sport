name: Tests Mon Sport
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe
        run: npm run check
      - name: Tests de non-régression
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances du collecteur ATP live
        run: python -m pip install requests beautifulsoup4
      - name: Tests du collecteur ATP live
        run: python -m unittest discover -s tests -p '*_py_test.py'
