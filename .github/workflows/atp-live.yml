name: Actualiser classement ATP live
on:
  push:
    branches: [feat/v14-atp-live-table]
    paths:
      - 'scripts/refresh_atp_live.py'
      - '.github/workflows/atp-live.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Collecter les données live avec validation
        run: python scripts/refresh_atp_live.py --debug
      - name: Conserver le dernier relevé sur main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/atp-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualiser ATP live (source publique)'
            git push
          fi
      - name: Publier la version avec ses données actualisées
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
