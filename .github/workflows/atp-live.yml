name: Actualiser les classements tennis et tennis de table
on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'scripts/refresh_atp_live.py'
      - 'scripts/refresh_tennis_live.py'
      - 'scripts/refresh_wtt.py'
      - '.github/workflows/atp-live.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: atp-live-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Collecter les classements WTA, Race ATP/WTA et Next Gen
        run: python -m scripts.refresh_tennis_live
      - name: Collecter les données live avec validation
        run: python scripts/refresh_atp_live.py --debug
      - name: Actualiser le classement ITTF top 150 hommes et femmes
        run: python scripts/refresh_wtt.py
        continue-on-error: true
      - name: Conserver le dernier relevé sur main
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v14-7-sports-rankings-responsive'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/atp-live.json data/wta-live.json data/atprace-live.json data/wtarace-live.json data/nextgen-live.json
          for file in data/wtt-men.json data/wtt-women.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualiser les classements tennis et ITTF vérifiés'
            git push
          fi
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
